server:
  port: 8082
  servlet:
      context-path: /project-manager

spring:
  application:
    name: projectManager
  datasource:
    url: jdbc:postgresql://localhost:5432/project_manager
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    user:
      name: admin
      password: 123456
      roles: ADMIN

  data:
    redis:
          host: localhost
          port: 6379
          database: 0
          timeout: 60000
          lettuce:
            pool:
              max-active: 8
              max-idle: 8
              min-idle: 0
              max-wait: -1

  docker:
    compose:
      enabled: true
      file: compose.yaml

#--------------CACHE CONFIG-----------
cache:
  ttl:
    member: 3600
    project: 3600

#--------------CLIENT MEMBER-----------
member:
  api:
    base-url: http://localhost:8089
    timeout: 5s

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 100
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
